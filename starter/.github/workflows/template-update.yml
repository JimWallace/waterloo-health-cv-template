# Weekly: if the template repository (cv.toml [template]) has a newer release than
# the one in template/, open a PR that updates template/ to it
# (scripts/update_template.sh). CV build then compiles both PDFs with the new
# template. Patch and minor releases are labelled auto-merge; a release that can
# change the interface (a new major version, or a new minor version before 1.0;
# see template/CHANGELOG.md) is labelled needs-review.
#
# If GitHub won't let workflows open pull requests (Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" is off), the branch is
# still pushed and built, and an issue gives a one-click link that opens the PR with
# its title, description and label filled in.
name: Template update

on:
  schedule:
    - cron: "23 11 * * 2" # Tuesdays 11:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # the fallback issue
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Update template/ to the newest release
        run: |
          current=$(python3 scripts/cvlib.py template.version)
          sh scripts/update_template.sh latest
          new=$(python3 scripts/cvlib.py template.version)
          if [ "$new" = "$current" ]; then echo "template/ is up to date ($current)."; exit 0; fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard template)" ]; then
            echo "No changes."; exit 0
          fi
          branch="template/$new"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A PR for $new is already open."; exit 0
          fi
          # Breaking releases: a new major version, or before 1.0 a new minor version.
          label=auto-merge
          cur_mm=$(echo "$current" | cut -d. -f1,2); new_mm=$(echo "$new" | cut -d. -f1,2)
          case "$new" in
            v0.*) [ "$cur_mm" = "$new_mm" ] || label=needs-review ;;
            *)    [ "${current%%.*}" = "${new%%.*}" ] || label=needs-review ;;
          esac
          git config user.name "template-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A template cv.toml
          git commit -q -m "Update the CV template to $new"
          git push -q --force origin "$branch"
          repo=$(python3 scripts/cvlib.py template.repo)
          gh label create "$label" --force >/dev/null 2>&1 || true
          title="Update the CV template to $new"
          note=""; review=""
          if [ "$label" = needs-review ]; then
            note=": this release can rename or remove commands, so check the CHANGELOG for anything to change in main.tex."
            review=", which holds the PR for your review (a PR you open yourself otherwise merges once CI passes)"
          fi
          body="Updates \`template/\` from $current to $new. Release notes: https://github.com/$repo/releases/tag/$new

          CV build compiles both PDFs with the new template. Labelled \`$label\`$note."
          if ! gh pr create --head "$branch" --base main --label "$label" --title "$title" --body "$body" 2>pr-error.txt; then
            cat pr-error.txt
            grep -q "not permitted to create or approve pull requests" pr-error.txt || exit 1
            # Fallback: an issue with a link that opens the PR, title, body and label filled in.
            link=$(TITLE="$title" BODY="$body" LABEL="$label" BRANCH="$branch" python3 -c 'import os, urllib.parse as u; print("https://github.com/" + os.environ["GH_REPO"] + "/compare/main..." + u.quote(os.environ["BRANCH"], safe="/") + "?" + u.urlencode({"expand": "1", "title": os.environ["TITLE"], "body": os.environ["BODY"], "labels": os.environ["LABEL"]}))')
            ititle="Template $new is ready: open its pull request"
            ibody="The Template update workflow updated \`template/\` to $new on the branch \`$branch\`, but GitHub doesn't let workflows open pull requests in this repository.

          **[Open the pull request]($link)**. Its title, description and the \`$label\` label are filled in; keep the label$review.

          CV build is already running on the branch. To let the workflow open these PRs itself: Settings → Actions → General → Workflow permissions → tick \"Allow GitHub Actions to create and approve pull requests\" → Save. Close this issue once the PR is open."
            gh label create template-update --color 5319E7 --force >/dev/null 2>&1 || true
            existing=$(gh issue list --state open --label template-update --search "in:title \"$ititle\"" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$ibody"
            else
              gh issue create --title "$ititle" --label template-update --body "$ibody"
            fi
            echo "::warning::Workflows can't open pull requests here; opened an issue with a link to open it instead."
          fi
          # PRs made with the workflow token don't start other workflows.
          gh workflow run cv-build.yml --ref "$branch"
