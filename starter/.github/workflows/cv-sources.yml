# Collects publication records for the weekly CV job and publishes them on the
# `cv-sources` branch (one commit, replaced each run):
#   candidates.json           new works and DOI backfills (scripts/fetch_candidates.py)
#   records/dblp-person.xml   DBLP's list of the owner's publications
#   records/crossref/*.json   Crossref metadata for every DOI in scholar.bib and candidates
#   records/index.json        DOI -> bib keys
# GitHub's runners can reach DBLP/OpenAlex/Crossref; Claude's scheduled sessions often
# can't, so they read these files with: git fetch origin cv-sources
name: CV sources

on:
  schedule:
    - cron: "7 23 * * 0" # Sundays 23:07 UTC = 18:07 Toronto, before the Monday job
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-sources
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # DBLP id, ORCID and OpenAlex id come from cv.toml [sources]; repo variables override.
      DBLP_PID: ${{ vars.DBLP_PID }}
      OPENALEX_AUTHOR_ID: ${{ vars.OPENALEX_AUTHOR_ID }}
      ORCID: ${{ vars.ORCID }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}           # optional; polite-pool contact for APIs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Fetch records
        run: |
          python3 scripts/fetch_candidates.py --out out/candidates.json --records-dir out/records
          cat > out/README.md <<EOF
          Generated by .github/workflows/cv-sources.yml from main@${GITHUB_SHA::7}
          on $(date -u +%Y-%m-%dT%H:%MZ). Replaced every run; do not edit.
          EOF
      - name: Publish to the cv-sources branch
        run: |
          cd out
          git init -q -b cv-sources
          git config user.name "cv-sources[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication records $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cv-sources
          echo "Published $(find records -type f | wc -l) record files." >> "$GITHUB_STEP_SUMMARY"
